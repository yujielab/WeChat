name: Cuven

options:
  bundleIdPrefix: us.cuven
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.5.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: "120.0.0"
    maxVersion: "300.0.0"

targets:
  Cuven:
    type: application
    platform: iOS
    sources:
      - path: Cuven
        excludes:
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: Lottie
      - package: WebRTC
      # Calls in the Dynamic Island and on the Lock Screen (Live Activities).
      - target: CuvenWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.cuven.app
        PRODUCT_NAME: Cuven
        INFOPLIST_FILE: Cuven/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule

  CuvenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CuvenWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.cuven.app.widgets
        PRODUCT_NAME: CuvenWidgets
        INFOPLIST_FILE: CuvenWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  Cuven:
    build:
      targets:
        Cuven: all
    run:
      config: Debug
    archive:
      config: Release
